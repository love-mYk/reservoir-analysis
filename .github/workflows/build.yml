name: Build Windows EXE

on:
  push:
    branches: [ main ]
    tags:     [ 'v*' ]
  workflow_dispatch:          # 允许手动触发

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # 1. 检出代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 配置 Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # 3. 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 找到 streamlit 包路径（用于 --add-data）
      - name: Get streamlit path
        id: stpath
        shell: pwsh
        run: |
          $p = python -c "import streamlit; import os; print(os.path.dirname(streamlit.__file__))"
          echo "ST_PATH=$p" >> $env:GITHUB_OUTPUT

      # 5. PyInstaller 打包
      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          $st = "${{ steps.stpath.outputs.ST_PATH }}"
          pyinstaller launcher.py `
            --onefile `
            --noconsole `
            --name "储层主控因素分析系统" `
            --add-data "app.py;." `
            --add-data "${st};streamlit" `
            --hidden-import streamlit `
            --hidden-import streamlit.web.cli `
            --hidden-import streamlit.runtime `
            --hidden-import sklearn.manifold `
            --hidden-import sklearn.preprocessing `
            --hidden-import scipy.spatial.distance `
            --hidden-import scipy.stats `
            --collect-all streamlit `
            --collect-all altair `
            --collect-all pydeck

      # 6. 上传 EXE 为 Artifact
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: 储层主控因素分析系统-Windows
          path: dist/储层主控因素分析系统.exe
          retention-days: 30

      # 7. 如果是 tag push，自动创建 Release 并附上 EXE
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/储层主控因素分析系统.exe
          generate_release_notes: true
