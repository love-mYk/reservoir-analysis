name: Build Windows EXE

on:
  push:
    branches: [ main ]
    tags:     [ 'v*' ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install streamlit==1.35.0 numpy pandas scipy scikit-learn matplotlib openpyxl pyinstaller

      - name: Get streamlit path
        id: stpath
        shell: pwsh
        run: |
          $p = python -c "import streamlit, os; print(os.path.dirname(streamlit.__file__))"
          echo "ST_PATH=$p" >> $env:GITHUB_OUTPUT

      - name: Build EXE
        shell: pwsh
        run: |
          $st = "${{ steps.stpath.outputs.ST_PATH }}"
          pyinstaller launcher.py `
            --onefile `
            --noconsole `
            --name "储层主控因素分析系统" `
            --add-data "app.py;." `
            --add-data "${st};streamlit" `
            --hidden-import streamlit `
            --hidden-import streamlit.web.cli `
            --hidden-import streamlit.runtime `
            --hidden-import sklearn.manifold `
            --hidden-import sklearn.preprocessing `
            --hidden-import scipy.spatial.distance `
            --hidden-import scipy.stats `
            --collect-all streamlit `
            --collect-all altair `
            --collect-all pydeck

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 储层主控因素分析系统-Windows
          path: dist/储层主控因素分析系统.exe
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/储层主控因素分析系统.exe
          generate_release_notes: true
